<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1F3A">
<title>Panel · Copa Logística Valencia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 38 42'%3E%3Cpath d='M19 1 37 6v15c0 10-8 17-18 20C9 38 1 31 1 21V6z' fill='%23C9A24B'/%3E%3Cpath d='M19 4.5 34 8.7v12.1c0 8.1-6.4 13.9-15 16.6-8.6-2.7-15-8.5-15-16.6V8.7z' fill='%230B1F3A'/%3E%3C/svg%3E">
<style>
html.locked,html.locked body{overflow:hidden}
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(90deg,rgba(8,20,40,.94),rgba(8,20,40,.72)),url("img/portada.jpg") 70% center/cover no-repeat,#0B1F3A;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#login[hidden]{display:none}
#login .card{width:100%;max-width:400px;background:#fff;color:#0E1A2B;border-radius:18px;padding:30px 26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:16px}
#login .head{display:flex;align-items:center;gap:12px}
#login .head svg{width:40px;height:44px;flex:none}
#login h1{font-family:Sora,"Segoe UI",system-ui,sans-serif;font-size:21px;line-height:1.15;margin:0;letter-spacing:-.01em}
#login .head small{display:block;color:#56657A;font-size:13px;font-weight:500}
#login label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#56657A}
#login input{font:inherit;font-size:16px;color:#0E1A2B;background:#fff;border:1px solid #CED6E0;border-radius:10px;padding:11px 12px;min-height:46px}
#login input:focus{outline:none;border-color:#1D3A63;box-shadow:0 0 0 3px rgba(29,58,99,.18)}
#login .go{min-height:48px;border:0;border-radius:10px;background:#0B1F3A;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#login .go:hover{background:#1D3A63}#login .go:disabled{opacity:.6;cursor:wait}
#login .err{color:#C2413B;font-size:14px;margin:0}#login .err:empty,#login .info:empty{display:none}
#login .info{color:#0E8F8F;font-size:14px;margin:0}
#login .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
#login .links button,#login .links a{background:none;border:0;padding:6px 0;color:#1D3A63;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
#login .links button:hover,#login .links a:hover{text-decoration:underline}
.brand .right .logout{min-height:34px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.brand .right .logout:hover{background:rgba(255,255,255,.1)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="login" hidden>
  <form class="card" id="lg-form" novalidate>
    <div class="head"><svg viewBox="0 0 38 42" aria-hidden="true"><path d="M19 1 37 6v15c0 10-8 17-18 20C9 38 1 31 1 21V6z" fill="#C9A24B"/><path d="M19 4.5 34 8.7v12.1c0 8.1-6.4 13.9-15 16.6-8.6-2.7-15-8.5-15-16.6V8.7z" fill="#0B1F3A"/><circle cx="19" cy="19" r="7.5" fill="none" stroke="#E2C27A" stroke-width="2"/><path d="M9 31h20" stroke="#E2C27A" stroke-width="2" stroke-linecap="round"/></svg>
      <div><h1>Panel de la organización</h1><small>Copa Logística Valencia</small></div></div>
    <label for="lg-email">Correo<input id="lg-email" type="email" autocomplete="username" inputmode="email" required></label>
    <label for="lg-pass">Contraseña<input id="lg-pass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lg-err" role="alert"></p><p class="info" id="lg-info" role="status"></p>
    <button class="go" id="lg-btn" type="submit">Entrar</button>
    <div class="links"><button type="button" id="lg-reset">He olvidado la contraseña</button><a href="./">Ver la portada</a></div>
  </form>
</div>

<script src="auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: centro de control nocturno — barra de marca con estado de guardado, navegación superior (escritorio) o inferior (móvil),
   un marcador principal por sección y módulos de datos compactos. Un solo tema oscuro, elegido a propósito. */
:root{
  color-scheme:light;
  --bg:#F5F7FA; --bg-2:#F0F3F7; --surface:#FFFFFF; --surface-2:#F5F7FA; --raise:#0B1F3A;
  --line:#E2E7EE; --line-2:#CED6E0;
  --ink:#0E1A2B; --muted:#56657A; --dim:#7D8A9C;
  --blue:#13294B; --blue-2:#1D3A63; --blue-soft:#E8EEF7; --blue-glow:rgba(19,41,75,.22);
  --cyan:#0E8F8F; --cyan-soft:#E2F4F3;
  --ok:#1F8A5B; --ok-soft:#E3F3EB;
  --warn:#B7791F; --warn-soft:#FBF0DC;
  --bad:#C2413B; --bad-soft:#FBE7E5;
  --gold:#B8913F; --gold-soft:#F7F0DF; --gold-2:#D9B66A;
  --navy:#0B1F3A; --navy-3:#1D3A63; --shadow:0 1px 2px rgba(14,26,43,.05),0 8px 24px -14px rgba(14,26,43,.14);
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#060C18; --bg-2:#0A1324; --surface:#0E192E; --surface-2:#132140; --raise:#172849;   --line:#1D2C4A; --line-2:#2A3D63;   --ink:#F2F5FB; --muted:#93A1BE; --dim:#64739A;   --blue:#3B7BFF; --blue-2:#6C9DFF; --blue-soft:rgba(59,123,255,.14); --blue-glow:rgba(59,123,255,.38);   --cyan:#2DD4EF; --cyan-soft:rgba(45,212,239,.13);   --ok:#34D399; --ok-soft:rgba(52,211,153,.13);   --warn:#FBBF24; --warn-soft:rgba(251,191,36,.13);   --bad:#F87171; --bad-soft:rgba(248,113,113,.13);   --gold:#F5C451; --gold-soft:rgba(245,196,81,.12);    --gold-2:#E2C27A;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#060C18; --bg-2:#0A1324; --surface:#0E192E; --surface-2:#132140; --raise:#172849;   --line:#1D2C4A; --line-2:#2A3D63;   --ink:#F2F5FB; --muted:#93A1BE; --dim:#64739A;   --blue:#3B7BFF; --blue-2:#6C9DFF; --blue-soft:rgba(59,123,255,.14); --blue-glow:rgba(59,123,255,.38);   --cyan:#2DD4EF; --cyan-soft:rgba(45,212,239,.13);   --ok:#34D399; --ok-soft:rgba(52,211,153,.13);   --warn:#FBBF24; --warn-soft:rgba(251,191,36,.13);   --bad:#F87171; --bad-soft:rgba(248,113,113,.13);   --gold:#F5C451; --gold-soft:rgba(245,196,81,.12);    --gold-2:#E2C27A;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(59,123,255,.16),transparent 60%),radial-gradient(900px 400px at -10% 10%,rgba(45,212,239,.07),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

/* ---------- barra de marca ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,12,24,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand .mark{width:38px;height:42px;flex:none}
.brand .name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.1;min-width:0}
.brand .name small{display:block;font-family:var(--ui);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.brand .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.deskNav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.deskNav button{background:none;border:0;padding:10px 14px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.deskNav button svg{width:17px;height:17px;opacity:.8}
.deskNav button:hover{color:var(--ink)}
.deskNav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--blue)}
.mobNav{display:none}

/* ---------- pastillas de estado ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent;line-height:1.3}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--blue-soft);color:var(--blue-2)}
.pill.cyan{background:var(--cyan-soft);color:var(--cyan)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.muted{background:rgba(147,161,190,.1);color:var(--muted)}
.pill.saving::before{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- estructura ---------- */
main .wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:26px}
#view.anim{animation:enter .22s ease-out}
@keyframes enter{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.sechead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.sechead h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.4vw,38px);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.sechead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0}
p{margin:0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px}
.panel{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.block{display:flex;flex-direction:column;gap:14px;min-width:0}
.cols{display:grid;gap:22px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font-family:var(--display);font-size:17px}

/* ---------- marcador principal ---------- */
.board{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(135deg,#0F2147 0%,#0B1730 45%,#081022 100%);padding:26px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.board::after{content:"";position:absolute;inset:auto -80px -120px auto;width:380px;height:380px;border-radius:50%;border:2px solid rgba(255,255,255,.05);box-shadow:0 0 0 70px rgba(255,255,255,.015)}
.board .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.board .title{font-family:var(--display);font-weight:800;font-size:clamp(30px,5.6vw,52px);line-height:1;letter-spacing:-.025em;margin:10px 0 12px;text-wrap:balance}
.board .facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px}
.board .facts b{color:var(--ink);font-weight:600}
.board .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.count{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding-left:24px;border-left:1px solid rgba(255,255,255,.08)}
.count .n{font-family:var(--display);font-weight:800;font-size:clamp(56px,10vw,96px);line-height:.9;letter-spacing:-.04em;background:linear-gradient(180deg,#fff,#9FBCFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.count .u{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2);overflow:hidden}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi .k{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--dim)}
.kpi .tag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.kpi .tag.prev{color:var(--warn)} .kpi .tag.real{color:var(--ok)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots i{width:22px;height:8px;border-radius:4px;background:var(--line-2)}
.slots i.on{background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px var(--blue-glow)}

/* ---------- partido destacado ---------- */
.feature{border:1px solid var(--line-2);border-radius:16px;background:linear-gradient(180deg,var(--surface-2),var(--surface));padding:20px;display:flex;flex-direction:column;gap:16px}
.feature .meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.vs .t b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.vs .score{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.vs .score.pend{color:var(--dim);font-size:22px;letter-spacing:.06em}

/* ---------- escudos ---------- */
.crest{display:grid;place-items:center;flex:none;color:#fff;font-family:var(--display);font-weight:800;letter-spacing:.01em;
  width:52px;height:58px;font-size:18px;padding-bottom:8px;clip-path:polygon(50% 0,100% 12%,100% 60%,50% 100%,0 60%,0 12%);
  box-shadow:inset 0 -14px 20px rgba(0,0,0,.25)}
.crest.sm{width:28px;height:32px;font-size:11px;padding-bottom:4px}
.crest.md{width:40px;height:45px;font-size:14px;padding-bottom:6px}
.crest.ghost{background:var(--line)!important;box-shadow:none;color:var(--dim)}

/* ---------- formularios ---------- */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f .req{color:var(--cyan);font-weight:700}
label.f .hint{font-weight:400;color:var(--dim);font-size:12px}
.err{color:var(--bad);font-size:12px;font-weight:500;min-height:0}
.err:empty{display:none}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;width:100%;min-width:0;min-height:44px;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:var(--dim)}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
input[aria-invalid="true"]{border-color:var(--bad)}
input::placeholder{color:var(--dim)}
.grid-f{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:start}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0;margin-bottom:10px}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--blue);background:linear-gradient(180deg,#4C88FF,#2F6BF0);color:#fff;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 20px -8px var(--blue-glow);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink);box-shadow:none}
.btn.ghost:hover{border-color:var(--blue-2)}
.btn.danger{background:transparent;border-color:rgba(248,113,113,.5);color:var(--bad);box-shadow:none}
.btn.big{min-height:54px;font-size:16px;padding:12px 22px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:18px;height:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}

/* ---------- tablas / listas ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tr.total td{font-family:var(--display);font-weight:700;font-size:16px;background:var(--bg-2)}

/* ---------- equipos ---------- */
.team{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.team.attn{border-left:3px solid var(--warn)}
.team>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.team>summary::-webkit-details-marker{display:none}
.team[open]>summary{background:var(--surface-2)}
.team .tn{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.team .ts{font-size:13px;color:var(--muted)}
.team .tags{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.team .money{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.team .money b{color:var(--ink);font-weight:600}
.team .body{padding:18px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.squad{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.squad .meter{width:90px}

/* ---------- cuadro ---------- */
.bracket{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:40px;overflow-x:auto;padding:6px 2px 12px}
.round{display:flex;flex-direction:column;gap:12px;min-width:0}
.round>h3{text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:24px}
.pair{position:relative;display:flex;flex-direction:column;gap:18px}
.pair::after{content:"";position:absolute;right:-21px;top:25%;bottom:25%;width:21px;border:2px solid var(--line-2);border-left:0;border-radius:0 10px 10px 0}
.pair::before{content:"";position:absolute;right:-40px;top:50%;width:19px;border-top:2px solid var(--line-2)}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .15s}
.match.done{border-color:rgba(52,211,153,.35)}
.match.live{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.match.final{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft),0 20px 40px -24px rgba(245,196,81,.4)}
.match .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.match .mh b{color:var(--ink);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.match.final .mh b{color:var(--gold)}
.side{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px}
.side+.side{border-top:1px solid var(--line)}
.side .n{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.side .n.tbd{color:var(--dim);font-weight:500;font-style:italic}
.side .g{font-family:var(--display);font-weight:800;font-size:24px;min-width:28px;text-align:right;color:var(--muted)}
.side .g small{font-size:12px;font-weight:600;color:var(--dim);margin-left:4px}
.side.win .n,.side.win .g{color:var(--ink)}
.side.win{background:linear-gradient(90deg,var(--ok-soft),transparent 70%)}
.side.lose .n,.side.lose .g{color:var(--dim)}
.match.final .side .g{font-size:30px}
.match .mf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}

/* ---------- calendario ---------- */
.tl{display:flex;flex-direction:column}
.tl .slot{display:grid;grid-template-columns:104px minmax(0,1fr);gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.tl .slot:last-child{border-bottom:0}
.tl .time{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;letter-spacing:-.02em}
.tl .time small{display:block;font-family:var(--ui);font-size:12px;font-weight:500;color:var(--dim);margin-top:6px;letter-spacing:0}
.tl .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tl .fc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.tl .fc .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tl .fc .c{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.tl .fc .m{font-weight:700}
.tl .fc .v{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.tl .slot.pause .fc{background:transparent;border-style:dashed}
.issues{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:10px;align-items:flex-start;font-size:14px}

/* ---------- avisos ---------- */
.note{border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--blue-soft);color:var(--blue-2)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);background:var(--raise);border:1px solid var(--line-2);color:var(--ink);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);display:flex;gap:10px;align-items:center}
.toast.bad{border-color:rgba(248,113,113,.5)}
[hidden]{display:none!important}

/* ---------- hoja de resultado (diálogo) ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,7,15,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);display:flex;flex-direction:column}
.sheet .sh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .sb{padding:18px;display:flex;flex-direction:column;gap:18px}
.sheet .sf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stepper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.stepper .who{display:flex;gap:10px;align-items:center;min-width:0}
.stepper .who b{font-family:var(--display);font-weight:700;overflow-wrap:anywhere}
.stepper .ctl{display:flex;align-items:center;gap:8px}
.stepper .ctl button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);font-size:24px;font-weight:700;cursor:pointer;color:var(--ink)}
.stepper .ctl button:disabled{opacity:.35;cursor:not-allowed}
.stepper .ctl output{font-family:var(--display);font-weight:800;font-size:34px;min-width:52px;text-align:center}
.review{border:1px solid var(--line-2);border-radius:12px;padding:16px;background:var(--bg-2);display:flex;flex-direction:column;gap:10px;text-align:center}
.review .big{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
textarea.copy{width:100%;min-height:200px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:12px}

/* ---------- jornada ---------- */
.jlist{display:flex;flex-direction:column;gap:12px}
.jcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px}
.jcard.live{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.jcard .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.jcard .top b{color:var(--ink);font-weight:700}

/* ---------- tallas ---------- */
.sizes{display:flex;flex-wrap:wrap;gap:10px}
.sizes span{display:flex;flex-direction:column;align-items:center;min-width:70px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg-2);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.sizes b{font-family:var(--display);font-size:26px;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-.02em}
ul.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ul.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ol.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:t}
ol.todo li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;counter-increment:t}
ol.todo li::before{content:counter(t);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--blue-soft);color:var(--blue-2)}

/* ---------- modos ---------- */
body:not([data-mode="admin"]) .deskNav,body:not([data-mode="admin"]) .mobNav,body:not([data-mode="admin"]) #syncPill{display:none!important}
.req-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.req-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.req-list .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.req-list .ic.y{background:var(--ok-soft);color:var(--ok)} .req-list .ic.n{background:var(--bad-soft);color:var(--bad)}
pre.code{margin:0;overflow-x:auto;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:14px;font-size:12.5px;line-height:1.55;color:#CFE0FF;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
ol.steps2{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
ol.steps2 li{padding-left:4px}
.diff{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) minmax(0,1fr);gap:6px 12px;font-size:13px}
.diff .h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.diff .old{color:var(--muted);text-decoration:line-through;overflow-wrap:anywhere}.diff .new{color:var(--ink);overflow-wrap:anywhere}
.pub-foot{text-align:center;color:var(--dim);font-size:13px}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.place{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.place .pos{font-family:var(--display);font-weight:800;font-size:22px;min-width:64px}
.place.p1{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--surface) 70%)}.place.p1 .pos{color:var(--gold)}
.scorers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.scorers li{display:grid;grid-template-columns:44px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px}
.scorers li+li{border-top:1px solid var(--line)}
.scorers .pos{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted)}
.scorers .who{display:flex;flex-direction:column;min-width:0}.scorers .who b{overflow-wrap:anywhere}.scorers .who small{color:var(--muted);font-size:12px}
.scorers .gl{display:flex;align-items:baseline;gap:5px}.scorers .gl b{font-family:var(--display);font-weight:800;font-size:22px}.scorers .gl small{color:var(--dim);font-size:12px}
.scorers li.top{background:linear-gradient(90deg,var(--gold-soft),transparent 70%)}.scorers li.top .pos{color:var(--gold)}
.gol-team{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg-2)}
.gol-team .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.gol-team .hd b{color:var(--ink)}
.gol-row{display:flex;gap:8px;align-items:center}.gol-row select{flex:1}
.gol-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.gol-list li{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px}
.gol-list .ctl{display:flex;gap:6px;align-items:center}
.gol-list .ctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.teamgrid span{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);font-weight:600;min-width:0;overflow-wrap:anywhere}

/* ---------- móvil ---------- */
@media (max-width:860px){
  .board{grid-template-columns:1fr}
  .count{padding-left:0;border-left:0;border-top:1px solid rgba(255,255,255,.08);padding-top:18px}
  .cols{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:760px){
  .deskNav{display:none}
  .mobNav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(8,15,30,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));justify-content:space-between;overflow-x:auto;scrollbar-width:none}
  .mobNav button{flex:1 0 58px;min-width:58px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--dim);cursor:pointer;min-height:48px;border-radius:10px}
  .mobNav button svg{width:21px;height:21px}
  .mobNav button[aria-current="page"]{color:var(--ink);background:var(--blue-soft)}
  main .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .brand .name small{display:none}
  .bracket{grid-template-columns:repeat(3,250px)}
  .tl .slot{grid-template-columns:70px minmax(0,1fr);gap:12px}
  .tl .time{font-size:20px}
  .team>summary{grid-template-columns:auto minmax(0,1fr)}
  .team .tags{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}
  .scrim{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

.deskNav button{color:#AFC0D6}.deskNav button:hover{color:#fff}.deskNav button[aria-current="page"]{color:#fff;border-bottom-color:var(--gold-2)}

<script>
/*LOGIC-START*/
const Logic=(function(){
"use strict";
const PLAZAS=8;
const ORDER=["C1","C2","C3","C4","S1","S2","F","T"];
const DEF={
  C1:{n:"Cuartos 1",fase:"Cuartos",a:{s:0},b:{s:1}},C2:{n:"Cuartos 2",fase:"Cuartos",a:{s:2},b:{s:3}},
  C3:{n:"Cuartos 3",fase:"Cuartos",a:{s:4},b:{s:5}},C4:{n:"Cuartos 4",fase:"Cuartos",a:{s:6},b:{s:7}},
  S1:{n:"Semifinal 1",fase:"Semifinales",a:{w:"C1"},b:{w:"C2"}},S2:{n:"Semifinal 2",fase:"Semifinales",a:{w:"C3"},b:{w:"C4"}},
  F:{n:"Final",fase:"Final",a:{w:"S1"},b:{w:"S2"}},T:{n:"3.º y 4.º puesto",fase:"Final",a:{l:"S1"},b:{l:"S2"}}};
const has=x=>x!==undefined&&x!==null&&x!=="";
const isInt=x=>Number.isInteger(x)&&x>=0&&x<=99;
/* Un resultado está confirmado cuando tiene goles enteros válidos y, si hay empate, penaltis válidos y distintos. */
function decided(r){if(!r||!isInt(r.ga)||!isInt(r.gb))return null;
  if(r.ga>r.gb)return"a";if(r.gb>r.ga)return"b";
  if(isInt(r.pa)&&isInt(r.pb)&&r.pa!==r.pb)return r.pa>r.pb?"a":"b";return null;}
/* undefined = aún no se sabe; null = plaza vacía */
function slot(src,ctx){
  if("s" in src){const asig=ctx.asig||[];if(!asig.length)return undefined;const id=asig[src.s];return id&&ctx.exists(id)?id:null;}
  const o=outcome(src.w||src.l,ctx);return src.w?o.w:o.l;}
function outcome(id,ctx){
  const d=DEF[id];const a=slot(d.a,ctx),b=slot(d.b,ctx);const r=(ctx.res||{})[id]||null;let w,l,bye=false,done=false;
  if(a===undefined||b===undefined){}
  else if(a===null&&b===null){w=null;l=null;}
  else if(a===null||b===null){w=a||b;l=null;bye=true;}
  else{const k=decided(r);if(k){done=true;w=k==="a"?a:b;l=k==="a"?b:a;}}
  return{id,a,b,w,l,r,bye,done};}
function status(id,ctx){const o=outcome(id,ctx);
  if(!(ctx.asig||[]).length)return"sin_sorteo";
  if(o.a===undefined||o.b===undefined)return"esperando";
  if(o.a===null&&o.b===null)return"vacio";
  if(o.bye)return"pase";
  if(o.done)return"finalizado";
  const r=o.r||{};
  if(isInt(r.ga)&&isInt(r.gb)&&r.ga===r.gb)return"desempate";
  if(r.estado==="en_juego")return"en_juego";
  return"pendiente";}
const hasData=r=>!!r&&(has(r.ga)||has(r.gb)||has(r.pa)||has(r.pb)||has(r.estado));
/* Aplica (o borra, con newR=undefined) el resultado de un partido e invalida los partidos posteriores cuyos rivales cambian. */
function applyResult(id,newR,ctx){
  const res={...(ctx.res||{})};if(newR===undefined)delete res[id];else res[id]=newR;
  const before={...ctx},cleared=[];const after={...ctx,res};
  const start=ORDER.indexOf(id);
  for(const d of ORDER.slice(start+1)){
    const pb=outcome(d,before),pa=outcome(d,after);
    if((pb.a!==pa.a||pb.b!==pa.b)&&hasData(res[d])){delete res[d];cleared.push(d);}}

function csv(rows){return"﻿"+rows.map(r=>r.map(v=>{const s=String(v??"");return/[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(";")).join("\r\n");}

const VIEWS={resumen:vResumen,inscripciones:vInscripciones,equipos:vEquipos,jugadores:vJugadores,jornada:vJornada,cuadro:vCuadro,calendario:vCalendario,finanzas:vFinanzas,campos:vCampos,incidencias:vIncidencias,integraciones:vIntegraciones,configuracion:vConfig};
